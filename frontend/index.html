<!doctype html>
<html lang="en">
  <head>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Slow Bean</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #0e1a13;
        transition: opacity 0.7s cubic-bezier(0.4,0,0.2,1),
                    visibility 0.7s cubic-bezier(0.4,0,0.2,1);
      }
      #splash.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ambient glow */
      #splash::before {
        content: '';
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(40,122,85,0.15) 0%, transparent 68%);
        pointer-events: none;
      }

      /* spinning ring + logo wrapper */
      #splash-ring {
        position: relative;
        width: 148px;
        height: 148px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: ring-enter 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
      }

      /* SVG spinner ring */
      #splash-ring svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        animation: ring-spin 1.6s linear infinite;
      }
      #splash-ring svg circle {
        fill: none;
        stroke: #287a55;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 88 220;
        opacity: 0.85;
      }

      #splash-logo {
        width: 108px;
        height: 108px;
        border-radius: 20px;
        object-fit: cover;
        box-shadow:
          0 0 0 1px rgba(40,122,85,0.3),
          0 20px 50px rgba(0,0,0,0.6);
        animation: logo-breathe 3s ease-in-out 0.7s infinite;
      }

      #splash-brand {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 13px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(246,247,244,0.45);
        animation: fade-up 0.9s ease 0.35s both;
      }

      @keyframes ring-enter {
        from { opacity: 0; transform: scale(0.8); }
        to   { opacity: 1; transform: scale(1);   }
      }
      @keyframes ring-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes logo-breathe {
        0%, 100% { opacity: 1;    }
        50%       { opacity: 0.8; }
      }
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0);   }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen — hidden once React mounts -->
    <div id="splash">
      <div id="splash-ring">
        <svg viewBox="0 0 148 148" xmlns="http://www.w3.org/2000/svg">
          <circle cx="74" cy="74" r="70"/>
        </svg>
        <img src="/logo1.jpg" alt="The Slow Bean" id="splash-logo" />
      </div>
      <div id="splash-brand">The Slow Bean</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
